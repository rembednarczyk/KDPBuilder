[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kdpbuilder"
version = "0.1.0"
description = "Generate and assemble children's coloring books for Amazon KDP."
requires-python = ">=3.9"
dependencies = [
    "pymupdf>=1.24",
    "numpy>=1.24",
    "pillow>=10.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gen = ["google-genai>=1.0"]
keywords = ["requests>=2.28"]  # only for the local Amazon autocomplete helper
logo = ["cairosvg>=2.5"]  # only to rasterize SVG logos for the cover

[project.scripts]
kdpbuilder = "kdpbuilder.cli:main"

[tool.setuptools]
packages = ["kdpbuilder"]

[tool.setuptools.package-data]
kdpbuilder = ["data/*.json", "data/fonts/*", "data/logo/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
