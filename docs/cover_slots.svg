<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1783 1560" font-family="DejaVu Sans, Arial, sans-serif">
  <rect x="0" y="0" width="1783" height="1560" fill="#ffffff"/>
  <text x="20" y="46" font-size="34" font-weight="bold" fill="#1b2b3a">Okładka KDP: sloty i źródła (co robi AI, co skrypt)</text>
  <text x="20" y="80" font-size="22" fill="#55606b">Pełny wrap 17,43 x 11,25 cala (tył | grzbiet | przód). Kolor = źródło danego elementu.</text>

  <!-- cover frame: offset ox=20 oy=110 ; W=1743 H=1125 ; bleed=13 -->
  <g>
    <!-- bleed (outer) -->
    <rect x="20" y="110" width="1743" height="1125" fill="#f2f5f8" stroke="#9aa7b3" stroke-dasharray="8 6" stroke-width="2"/>

    <!-- BACK hero/wraparound bg (AI-derived) : trim x 33..883 -->
    <rect x="20" y="110" width="863" height="1125" fill="#cfe3f6"/>
    <!-- FRONT hero art (AI) : from spine right edge to right bleed -->
    <rect x="901" y="110" width="862" height="1125" fill="#bcd7f0"/>
    <!-- SPINE -->
    <rect x="883" y="110" width="18" height="1125" fill="#cdeacf"/>

    <!-- trim guide -->
    <rect x="33" y="123" width="1717" height="1099" fill="none" stroke="#7f8c99" stroke-width="1.5"/>
    <line x1="883" y1="110" x2="883" y2="1235" stroke="#7f8c99" stroke-width="1.2"/>
    <line x1="901" y1="110" x2="901" y2="1235" stroke="#7f8c99" stroke-width="1.2"/>

    <!-- ===== FRONT ===== -->
    <!-- Title (procedural) -->
    <rect x="945" y="150" width="770" height="210" rx="18" fill="#cdeacf" stroke="#3f7d47" stroke-width="3"/>
    <text x="1330" y="240" font-size="30" font-weight="bold" fill="#22432a" text-anchor="middle">TYTUŁ</text>
    <text x="1330" y="278" font-size="20" fill="#22432a" text-anchor="middle">skrypt: gradient, gloss,</text>
    <text x="1330" y="304" font-size="20" fill="#22432a" text-anchor="middle">podwójny kontur, cień 3D</text>

    <!-- Count badge (procedural) -->
    <circle cx="1690" cy="430" r="70" fill="#cdeacf" stroke="#3f7d47" stroke-width="3"/>
    <text x="1690" y="425" font-size="18" font-weight="bold" fill="#22432a" text-anchor="middle">naklejka</text>
    <text x="1690" y="448" font-size="16" fill="#22432a" text-anchor="middle">40 wzorów</text>

    <!-- Subtitle/author banner = AI SLOT -->
    <rect x="945" y="965" width="770" height="215" rx="20" fill="#fbc7e0" stroke="#c81e78" stroke-width="4" stroke-dasharray="12 7"/>
    <text x="1330" y="1035" font-size="27" font-weight="bold" fill="#7a1447" text-anchor="middle">SLOT: podtytuł + autor</text>
    <text x="1330" y="1072" font-size="20" fill="#7a1447" text-anchor="middle">wstęga proceduralna LUB</text>
    <text x="1330" y="1098" font-size="20" fill="#7a1447" text-anchor="middle">dekoracja z AI (--subtitle-asset)</text>
    <text x="1330" y="1128" font-size="18" fill="#7a1447" text-anchor="middle">tekst zawsze składa skrypt (PL)</text>

    <!-- ===== BACK ===== -->
    <!-- Blurb panel = AI SLOT -->
    <rect x="70" y="150" width="760" height="250" rx="20" fill="#fbc7e0" stroke="#c81e78" stroke-width="4" stroke-dasharray="12 7"/>
    <text x="450" y="235" font-size="27" font-weight="bold" fill="#7a1447" text-anchor="middle">SLOT: blurb (opis na tył)</text>
    <text x="450" y="272" font-size="20" fill="#7a1447" text-anchor="middle">panel proceduralny LUB</text>
    <text x="450" y="298" font-size="20" fill="#7a1447" text-anchor="middle">dekoracja z AI (--blurb-asset)</text>
    <text x="450" y="330" font-size="18" fill="#7a1447" text-anchor="middle">tekst zawsze składa skrypt (PL)</text>

    <!-- Thumbnails (AI interior images) -->
    <g stroke="#2f6fb0" stroke-width="3" fill="#eaf3fc">
      <rect x="120" y="470" width="230" height="300" rx="14" transform="rotate(-7 235 620)"/>
      <rect x="470" y="450" width="230" height="300" rx="14" transform="rotate(7 585 600)"/>
      <rect x="300" y="560" width="240" height="310" rx="14" transform="rotate(-3 420 715)"/>
    </g>
    <text x="450" y="915" font-size="24" font-weight="bold" fill="#1c4a78" text-anchor="middle">miniaturki wzorów</text>
    <text x="450" y="946" font-size="19" fill="#1c4a78" text-anchor="middle">obrazy z AI (wnętrze), skrypt układa kolaż</text>

    <!-- Logo (brand SVG) -->
    <rect x="60" y="1010" width="300" height="150" rx="14" fill="#fbe6a8" stroke="#b8860b" stroke-width="3"/>
    <text x="210" y="1075" font-size="22" font-weight="bold" fill="#6b4e07" text-anchor="middle">LOGO</text>
    <text x="210" y="1105" font-size="18" fill="#6b4e07" text-anchor="middle">Twój SVG (Kolorowe Skarby)</text>

    <!-- Barcode (KDP) -->
    <rect x="640" y="1010" width="210" height="150" rx="8" fill="#dddddd" stroke="#888888" stroke-width="3"/>
    <text x="745" y="1075" font-size="20" font-weight="bold" fill="#444444" text-anchor="middle">KOD KRESKOWY</text>
    <text x="745" y="1103" font-size="17" fill="#444444" text-anchor="middle">wstawia KDP</text>

    <!-- Spine label -->
    <text x="892" y="680" font-size="18" fill="#22432a" text-anchor="middle" transform="rotate(-90 892 680)">grzbiet: tytuł (skrypt, od 79 stron)</text>

    <!-- Panel captions -->
    <text x="450" y="1205" font-size="20" font-weight="bold" fill="#1c4a78" text-anchor="middle">TYŁ</text>
    <text x="1330" y="1205" font-size="20" font-weight="bold" fill="#1c4a78" text-anchor="middle">PRZÓD</text>
  </g>

  <!-- ===== LEGEND ===== -->
  <g transform="translate(20,1275)">
    <text x="0" y="0" font-size="24" font-weight="bold" fill="#1b2b3a">Legenda</text>
    <g font-size="21" fill="#2b3742">
      <rect x="0" y="20" width="34" height="24" fill="#bcd7f0" stroke="#2f6fb0"/>
      <text x="46" y="39">Grafika z AI (przód) i tło wraparound wyprowadzone z niej</text>

      <rect x="0" y="56" width="34" height="24" fill="#eaf3fc" stroke="#2f6fb0"/>
      <text x="46" y="75">Miniaturki: obrazy z AI (wnętrze), kolaż układa skrypt</text>

      <rect x="0" y="92" width="34" height="24" fill="#fbc7e0" stroke="#c81e78" stroke-dasharray="10 6" stroke-width="3"/>
      <text x="46" y="111" font-weight="bold" fill="#7a1447">SLOTY zapięte pod AI: podtytuł i blurb (opcjonalna dekoracja z AI; tekst składa skrypt)</text>

      <rect x="0" y="128" width="34" height="24" fill="#cdeacf" stroke="#3f7d47"/>
      <text x="46" y="147">Skrypt (nie AI): tytuł, naklejka, wstęgi domyślne, bąbelki, tekst grzbietu</text>

      <rect x="0" y="164" width="34" height="24" fill="#fbe6a8" stroke="#b8860b"/>
      <text x="46" y="183">Twój asset: logo marki (SVG)</text>

      <rect x="900" y="164" width="34" height="24" fill="#dddddd" stroke="#888888"/>
      <text x="946" y="183">KDP: strefa kodu kreskowego (trzymana czysta)</text>
    </g>
  </g>
</svg>
